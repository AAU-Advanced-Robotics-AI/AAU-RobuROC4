pgo:
  ros__parameters:
    # ---- topics / frames ---------------------------------------------------
    # ONLINE config: pgo_node runs live on the robot as the global localizer,
    # replacing robot_localization's ekf_global + the gps_to_enu/lio_to_enu/
    # gps_relay chain. It owns the map->odom TF; ekf_local still owns odom->base_link.
    # Inputs are the live FAST-LIO + u-blox streams (same topic names as the bags).
    odom_topic: /Odometry                # FAST-LIO2 (camera_init -> body)
    cloud_topic: /cloud_registered       # FAST-LIO2 registered scan (world frame)
    cloud_frame_mode: odom
    gps_input_mode: fused                # position+cov from /fix, RTK flag from navpvt
    navpvt_topic: /ublox_gps_node/navpvt
    gps_topic: /ublox_gps_node/fix
    map_frame: map
    base_frame: base_link
    gps_frame: gps_link                  # URDF antenna link (looked up from live TF)
    publish_tf: true                     # broadcast map -> odom
    publish_enu: true                    # publish in ENU/datum frame (world-aligned,
                                         # GPS-anchored) — a true global localizer like
                                         # the EKF, not the raw LIO-start map frame
    sync_slop: 0.1
    save_directory: ~/pgo_output

    # ---- extrinsics --------------------------------------------------------
    # On the robot these are looked up from the live TF tree (robot_state_publisher
    # from the URDF): livox_frame->gps_link and livox_frame->base_link. The values
    # below are the fallback used only if that lookup fails (and when replaying a
    # bag without robot_state_publisher). Derived from sensor_mount.yaml.
    antenna_lever: [-1.28779, 0.285, 0.197888]
    t_body_base:   [-0.213742, 0.0, -0.946425]
    q_body_base:   [0.975395, 0.0, -0.220463, 0.0]   # w x y z (pitch -0.44457789)

    # ---- keyframing ---------------------------------------------------------
    keyframe_dist: 1.0
    keyframe_angle_deg: 15.0
    keyframe_voxel: 0.25
    cloud_min_range: 0.5
    cloud_max_range: 100.0

    # ---- factor noise -------------------------------------------------------
    prior_sigma_rot: 0.05
    prior_sigma_trans: 0.10
    odom_sigma_rot: 0.01
    odom_sigma_trans: 0.05

    # ---- GPS (RTK-class covariance scaling; see pgo_offline.yaml notes) -----
    use_gps: true
    use_float: true
    use_nonrtk: true
    fixed_sigma_floor: 0.02
    fixed_sigma_cap: 0.30
    float_sigma_floor: 0.30
    gps_cov_scale_fixed: 1.0
    gps_cov_scale_float: 25.0
    nonrtk_sigma: 3.0
    gps_z_sigma_scale: 2.0
    float_meas_sigma: 0.15
    float_bias_prior_sigma: 2.0
    float_bias_rw_sigma: 0.10
    float_bias_session_gap: 30.0
    gps_robust: true
    gps_time_tol: 0.20
    gps_max_interp_gap: 0.6
    gps_assoc_timeout: 5.0
    fixed_max_std: 0.05
    float_max_std: 1.0

    # ---- ENU <-> map alignment ---------------------------------------------
    align_min_travel: 10.0
    align_min_travel_float: 40.0
    align_min_pairs: 10
    align_max_rms: 1.0
    align_max_rms_float: 2.5

    # ---- loop closure -------------------------------------------------------
    enable_loop_closure: true
    sc_num_ring: 20
    sc_num_sector: 60
    sc_max_radius: 80.0
    sc_dist_threshold: 0.13
    sc_num_candidates: 10
    sc_exclude_recent: 50
    sc_lidar_height: 0.7625
    loop_min_query_gap: 5
    loop_period: 0.5
    loop_max_per_tick: 2
    icp_method: gicp
    icp_voxel: 0.4
    submap_size: 12
    icp_max_corr: 2.0
    icp_min_fitness: 0.45
    icp_max_rmse: 0.40
    loop_sigma_rot: 0.05
    loop_sigma_trans: 0.20
    loop_robust_k: 1.0

    # ---- outputs ------------------------------------------------------------
    map_voxel: 0.30
    map_pub_period: 3.0                   # publish /pgo/map every 3 s for live RViz

name: ROS 2 Build

# Build on push and pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Build jobs
jobs:
  build:
    runs-on: ubuntu-24.04 # Run on Ubuntu 24.04
    container:
      image: ros:jazzy # Use ROS 2 Jazzy image
    
    steps:
      # Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Note: Caching can be added back if needed for faster builds
      # See: https://github.com/marketplace/actions/cache

      # Install dependencies
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            ros-jazzy-xacro \
            ros-jazzy-joint-state-publisher \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-ros-gz \
            ros-jazzy-image-transport \
            ros-jazzy-camera-info-manager \
            ros-jazzy-vision-msgs \
            ros-jazzy-realsense2-camera \
            ros-jazzy-realsense2-description \
            ros-jazzy-velodyne-description \
            ros-jazzy-teleop-twist-keyboard
          pip3 install --break-system-packages canopen pydantic nest-asyncio

      # Create workspace and copy source
      - name: Create workspace and copy source
        run: |
          mkdir -p /ros2_ws/src
          cp -r src/* /ros2_ws/src/

      # Install rosdep dependencies
      - name: Install rosdep dependencies
        run: |
          cd /ros2_ws
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y || true

      # Build workspace
      - name: Build workspace
        run: |
          cd /ros2_ws
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      # List installed packages
      - name: List installed packages
        run: |
          cd /ros2_ws
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "✅ Successfully built packages:"
          ros2 pkg list | grep -E 'RobuROC|roburoc|canopen|imu' || echo "Core packages built"
        shell: bash
